<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Pi Jev Route</title>
<style>
:root{color-scheme:light;--background:#fff;--foreground:#242424;--primary:#292929;--secondary:#f5f5f5;--muted:#626262;--destructive:#a12727;--border:#d9d9d9;--control-border:#858585;--ring:#454545;--text-sm:.875rem;--text-base:1rem;--text-lg:1.25rem;--radius-sm:4px;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font:var(--text-base)/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:960px;margin:auto;padding:var(--space-8) var(--space-6) 64px}header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap}h1{font-size:var(--text-lg);font-weight:600;margin:0}h2{font-size:var(--text-base);font-weight:600;margin:0 0 var(--space-4)}p{margin:var(--space-2) 0}.muted,.hint{color:var(--muted);font-size:var(--text-sm)}section{padding-top:var(--space-8)}button,input,select,textarea{font:inherit;color:inherit}button{background:var(--background);border:1px solid var(--control-border);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-4);cursor:pointer;min-height:36px}button:hover{background:var(--secondary)}button:disabled{opacity:.5;cursor:not-allowed}:focus-visible{outline:2px solid var(--ring);outline-offset:3px}fieldset{border:0;padding:0;margin:0;min-width:0}label{display:block;font-size:var(--text-sm);margin-bottom:var(--space-2)}.check{display:flex;align-items:center;gap:var(--space-2);min-height:32px}.check input{width:20px;height:20px;accent-color:var(--primary);margin:0}input[type=number],select,textarea{width:100%;border:1px solid var(--control-border);border-radius:var(--radius-sm);background:var(--background);padding:var(--space-2);font-size:var(--text-sm)}textarea{resize:vertical;min-height:64px}textarea::placeholder{color:var(--muted)}.field{margin:var(--space-4) 0;max-width:480px}#locale{width:auto;min-width:120px}.tools{display:flex;align-items:center;gap:var(--space-3)}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:var(--text-sm);text-align:left}th{font-weight:500;color:var(--muted);background:var(--secondary)}th,td{padding:var(--space-3);border-bottom:1px solid var(--border);vertical-align:top}#models-table{min-width:560px}#models-table td:last-child{width:55%}#logs-table{min-width:880px}#logs-table td{min-width:88px;max-width:220px;overflow-wrap:anywhere}details{border-top:1px solid var(--border);padding:var(--space-4) 0;margin:var(--space-4) 0}summary{cursor:pointer;min-height:24px}.status{min-height:24px;margin:var(--space-3) 0;font-size:var(--text-sm)}.error{color:var(--destructive)}#logs{border-top:1px solid var(--border);margin-top:var(--space-8)}[hidden]{display:none!important}@media(max-width:600px){main{padding:var(--space-6) var(--space-4)}h1{font-size:var(--text-base)}}
</style>
</head>
<body>
<main>
<header>
  <h1>Pi Jev Route</h1>
  <div class="tools">
    <label for="locale" id="locale-label">语言</label>
    <select id="locale"><option value="zh">中文</option><option value="en">English</option></select>
    <button id="refresh" type="button">刷新</button>
  </div>
</header>
<p id="status" class="status" role="status" aria-live="polite"></p>
<section id="rules">
<h2 id="rules-title">模型</h2>
<p class="muted" id="current-line"></p>
<form id="settings-form"><fieldset id="fields" disabled>
<label class="check" for="enabled"><input id="enabled" type="checkbox"><span id="enabled-label">启用派发前选型</span></label>
<p id="models-empty" class="muted" hidden></p>
<div class="scroll" tabindex="0" role="region" aria-labelledby="models-caption"><table id="models-table"><thead><tr><th scope="col" id="col-allow">允许</th><th scope="col" id="col-model">模型</th><th scope="col" id="col-desc">适用说明</th></tr></thead><tbody id="models"></tbody></table></div>
<div class="field"><label for="fallback" id="fallback-label">回退模型</label><select id="fallback"></select></div>
<label class="check" for="style-main"><input id="style-main" type="checkbox"><span id="style-label">样式任务用当前模型 + low</span></label>
<details><summary id="advanced-label">高级</summary>
<div class="field"><label for="confidence" id="confidence-label">最低置信度</label><input id="confidence" type="number" min="0" max="1" step="0.05" required></div>
<div class="field"><label for="timeout" id="timeout-label">超时（毫秒）</label><input id="timeout" type="number" min="1000" max="30000" step="1" required></div>
<div class="field"><label for="instructions" id="instructions-label">补充指令</label><textarea id="instructions" rows="3" maxlength="2000"></textarea></div>
</details>
</fieldset></form>
</section>
<section id="logs">
<h2 id="logs-title">日志</h2>
<p id="empty" class="muted"></p>
<div class="scroll" tabindex="0" role="region" aria-labelledby="logs-title"><table id="logs-table" hidden><thead><tr>
<th scope="col" id="col-time">时间</th><th scope="col" id="col-agent">Agent</th><th scope="col" id="col-choice">选型</th>
<th scope="col" id="col-report">报告</th><th scope="col" id="col-state">状态</th><th scope="col" id="col-reason">原因</th>
</tr></thead><tbody id="log-rows"></tbody></table></div>
</section>
</main>
<script>
(() => {
  'use strict';
  const token = location.hash.slice(1);
  history.replaceState(null, '', location.pathname + location.search);
  const $ = id => document.getElementById(id);
  const ui = {
    zh: {
      localeLabel:'语言', refresh:'刷新', rules:'模型', enabled:'启用派发前选型',
      allow:'允许', model:'模型', desc:'适用说明', current:'当前主模型',
      fallback:'回退模型', fallbackAuto:'自动：low 或当前允许模型', fallbackGone:'（当前不可用）',
      style:'样式任务用当前模型 + low', advanced:'高级', minConfidence:'最低置信度',
      timeout:'超时（毫秒）', instructions:'补充指令', logs:'日志', empty:'暂无日志。',
      emptyModels:'enabledModels 为空。', currentLine:'主模型 ',
      outcomes:{selected:'已选型',fallback:'已回退',explicit:'显式指定',blocked:'已阻止',skipped:'已跳过',error:'错误'},
      cols:{time:'时间',agent:'Agent',choice:'选型',report:'报告',state:'状态',reason:'原因'},
      unreported:'未报告', score:'置信度',
      reading:'正在读取…', synced:'已同步。', syncing:'正在同步…',
      fileError:'设置文件读取失败，请修复后刷新。',
      auth:'缺少认证信息，请重新执行 /pi-jev-route。',
      connect:'连接失败，请重新执行 /pi-jev-route。',
      expire:'认证失效，请重新执行 /pi-jev-route。',
      request:'请求失败，未保存。', incomplete:'服务返回不完整，未保存。',
      conflict:'设置已在别处修改，已重新读取。', invalid:'输入无效，未同步。'
    },
    en: {
      localeLabel:'Language', refresh:'Refresh', rules:'Models', enabled:'Route before dispatch',
      allow:'Allow', model:'Model', desc:'When to use', current:'parent',
      fallback:'Fallback', fallbackAuto:'Auto: low or an allowed model', fallbackGone:'(unavailable)',
      style:'Style work uses current model + low', advanced:'Advanced', minConfidence:'Min confidence',
      timeout:'Timeout (ms)', instructions:'Extra instructions', logs:'Logs', empty:'No logs yet.',
      emptyModels:'enabledModels is empty.', currentLine:'Parent ',
      outcomes:{selected:'Selected',fallback:'Fallback',explicit:'Explicit',blocked:'Blocked',skipped:'Skipped',error:'Error'},
      cols:{time:'Time',agent:'Agent',choice:'Choice',report:'Reported',state:'Status',reason:'Reason'},
      unreported:'Not reported', score:'confidence',
      reading:'Loading…', synced:'Synced.', syncing:'Syncing…',
      fileError:'Settings file unreadable. Fix it, then refresh.',
      auth:'Missing auth. Run /pi-jev-route again.',
      connect:'Connection failed. Run /pi-jev-route again.',
      expire:'Auth expired. Run /pi-jev-route again.',
      request:'Request failed. Not saved.', incomplete:'Incomplete response. Not saved.',
      conflict:'Settings changed elsewhere. Reloaded.', invalid:'Invalid input. Not synced.'
    }
  };
  let snapshot = null, etag = '', busy = false, locale = 'zh', saveTimer = 0;
  const modelInputs = new Map(), logRows = new Map();
  const L = () => ui[locale] || ui.zh;
  const text = value => typeof value === 'string' ? value : value == null ? '—' : JSON.stringify(value);
  function node(tag, value) { const el = document.createElement(tag); if (value !== undefined) el.textContent = text(value); return el; }
  function status(message, error = false) { $('status').textContent = message; $('status').classList.toggle('error', error); }
  function applyChrome() {
    const t = L();
    document.documentElement.lang = locale === 'en' ? 'en' : 'zh-CN';
    $('locale-label').textContent = t.localeLabel;
    $('refresh').textContent = t.refresh;
    $('rules-title').textContent = t.rules;
    $('enabled-label').textContent = t.enabled;
    $('col-allow').textContent = t.allow;
    $('col-model').textContent = t.model;
    $('col-desc').textContent = t.desc;
    $('fallback-label').textContent = t.fallback;
    $('style-label').textContent = t.style;
    $('advanced-label').textContent = t.advanced;
    $('confidence-label').textContent = t.minConfidence;
    $('timeout-label').textContent = t.timeout;
    $('instructions-label').textContent = t.instructions;
    $('logs-title').textContent = t.logs;
    $('empty').textContent = t.empty;
    $('col-time').textContent = t.cols.time;
    $('col-agent').textContent = t.cols.agent;
    $('col-choice').textContent = t.cols.choice;
    $('col-report').textContent = t.cols.report;
    $('col-state').textContent = t.cols.state;
    $('col-reason').textContent = t.cols.reason;
    if (snapshot) {
      $('current-line').textContent = t.currentLine + (text(snapshot.currentModel));
      for (const fields of modelInputs.values()) {
        fields.allowText.textContent = t.allow;
        if (fields.currentLabel) fields.currentLabel.textContent = ' ' + t.current;
      }
      fallbackOptions();
      renderLogs(snapshot.logs);
    }
  }
  function lock(value) {
    busy = value;
    $('refresh').disabled = value || !token;
    $('fields').disabled = value || !snapshot || !!snapshot.settingsError;
    $('locale').disabled = value || !snapshot || !!snapshot.settingsError;
  }
  async function request(path, method = 'GET', body, version) {
    const headers = {Authorization: 'Bearer ' + token};
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    if (version !== undefined) headers['If-Match'] = version;
    let response;
    try { response = await fetch(path, {method, headers, cache:'no-store', body: body === undefined ? undefined : JSON.stringify(body)}); }
    catch { throw new Error(L().connect); }
    if (!response.ok) {
      const error = new Error(response.status === 401 || response.status === 403 ? L().expire : L().request);
      error.status = response.status; throw error;
    }
    const data = await response.json();
    if (!data || !data.settings || !Array.isArray(data.models) || !Array.isArray(data.logs)) throw new Error(L().incomplete);
    return {data, version:response.headers.get('ETag') || ''};
  }
  function fallbackOptions(selected = $('fallback').value) {
    const t = L();
    $('fallback').replaceChildren(new Option(t.fallbackAuto, ''));
    for (const [id, fields] of modelInputs) if (fields.enabled.checked) $('fallback').append(new Option(id, id));
    if (selected && ![...$('fallback').options].some(option => option.value === selected)) {
      const option = new Option(selected + ' ' + t.fallbackGone, selected); option.disabled = true; $('fallback').append(option);
    }
    $('fallback').value = selected;
    $('fallback').setCustomValidity(selected && !modelInputs.get(selected)?.enabled.checked ? t.invalid : '');
  }
  function populate(data) {
    const s = data.settings;
    locale = s.locale === 'en' ? 'en' : 'zh';
    $('locale').value = locale;
    $('enabled').checked = s.enabled; $('style-main').checked = s.styleUseMain;
    $('confidence').value = s.confidenceThreshold; $('timeout').value = s.timeoutMs; $('instructions').value = s.instructions;
    $('models').replaceChildren(); modelInputs.clear();
    data.models.forEach((model, index) => {
      const tr = node('tr'), checkCell = node('td'), modelCell = node('td'), descriptionCell = node('td');
      const enabled = node('input'); enabled.type = 'checkbox'; enabled.id = 'model-enabled-' + index;
      enabled.checked = s.models?.[model.id]?.enabled ?? model.enabled;
      const checkLabel = node('label'); checkLabel.className = 'check'; checkLabel.htmlFor = enabled.id;
      const allowText = node('span', L().allow); checkLabel.append(enabled, allowText); checkCell.append(checkLabel);
      modelCell.append(node('strong', model.name || model.id), node('div', model.id));
      const currentLabel = model.current ? node('span', ' ' + L().current) : null;
      if (currentLabel) modelCell.append(currentLabel);
      const description = node('textarea'); description.id = 'model-description-' + index; description.maxLength = 1000; description.rows = 2;
      description.value = s.models?.[model.id]?.description || model.description || '';
      descriptionCell.append(description); tr.append(checkCell, modelCell, descriptionCell); $('models').append(tr);
      modelInputs.set(model.id, {enabled, description, allowText, currentLabel, model, row: tr});
      enabled.addEventListener('change', () => fallbackOptions());
    });
    $('models-empty').hidden = data.models.length !== 0;
    $('models-empty').textContent = L().emptyModels;
    $('models-table').hidden = data.models.length === 0;
    fallbackOptions(s.fallbackModel || '');
  }
  function payload() {
    const models = {...snapshot.settings.models};
    for (const [id, fields] of modelInputs) Object.defineProperty(models, id, {value:{enabled:fields.enabled.checked,description:fields.description.value},enumerable:true,configurable:true,writable:true});
    return {...snapshot.settings, enabled:$('enabled').checked, fallbackModel:$('fallback').value, styleUseMain:$('style-main').checked, confidenceThreshold:Number($('confidence').value), timeoutMs:Number($('timeout').value), locale:$('locale').value === 'en' ? 'en' : 'zh', instructions:$('instructions').value, models};
  }
  function renderLogs(logs) {
    const t = L();
    $('empty').hidden = logs.length > 0; $('empty').textContent = t.empty; $('logs-table').hidden = !logs.length;
    for (const log of logs) {
      let row = logRows.get(log.id);
      if (!row) {
        const tr = node('tr'), cells = Array.from({length:6}, () => node('td'));
        tr.append(...cells); $('log-rows').append(tr); row = {cells}; logRows.set(log.id, row);
      }
      const date = new Date(log.at);
      const report = log.actualModel ? text(log.actualModel) + (log.actualThinking ? ' · ' + text(log.actualThinking) : '') : t.unreported;
      const values = [Number.isNaN(date.getTime()) ? text(log.at) : date.toLocaleString(locale === 'en' ? 'en' : 'zh-CN'), log.agent || '—', log.requestedModel || '—', report, (t.outcomes[log.outcome] || text(log.outcome)) + (log.actualStatus ? ' / ' + text(log.actualStatus) : ''), text(log.reason) + (Number.isFinite(log.confidence) ? ' · ' + t.score + ' ' + log.confidence : '')];
      row.cells.forEach((cell, index) => { cell.textContent = text(values[index]); });
    }
  }
  async function persist() {
    if (!snapshot || snapshot.settingsError || busy || !etag || !$('settings-form').checkValidity()) return;
    const body = payload();
    lock(true); status(L().syncing);
    try {
      const {data, version} = await request('/settings', 'PUT', body, etag);
      snapshot = data; etag = version; locale = data.settings.locale === 'en' ? 'en' : 'zh';
      applyChrome();
      status(data.settingsError ? L().fileError : L().synced, !!data.settingsError);
    } catch (error) {
      if (error.status === 409) {
        try {
          const latest = await request('/settings');
          snapshot = latest.data; etag = latest.version; locale = snapshot.settings.locale === 'en' ? 'en' : 'zh';
          populate(snapshot); applyChrome(); status(L().conflict, true);
        } catch (reload) { status(reload.message, true); }
      } else status(error.message, true);
    } finally { lock(false); }
  }
  function scheduleSave(delay) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { persist(); }, delay);
  }
  async function refresh() {
    if (busy || !token) return;
    lock(true); status(L().reading);
    try {
      const {data, version} = await request('/settings'); snapshot = data; etag = version;
      populate(data); applyChrome();
      logRows.clear(); $('log-rows').replaceChildren(); renderLogs(data.logs);
      status(data.settingsError ? L().fileError : L().synced, !!data.settingsError);
    } catch (error) { status(error.message, true); }
    finally { lock(false); }
  }
  $('settings-form').addEventListener('input', event => {
    if (event.target.closest('textarea') || event.target.type === 'number') scheduleSave(400);
    else scheduleSave(0);
  });
  $('fallback').addEventListener('change', () => fallbackOptions());
  $('locale').addEventListener('change', () => { locale = $('locale').value === 'en' ? 'en' : 'zh'; applyChrome(); scheduleSave(0); });
  $('settings-form').addEventListener('submit', event => event.preventDefault());
  $('refresh').addEventListener('click', refresh);
  if (!token) { status(L().auth, true); lock(false); } else refresh();
})();
</script>
</body>
</html>
