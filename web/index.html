<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Pi Jev Route</title>
<style>
:root{color-scheme:light dark;--background:light-dark(#f6f3ed,#141614);--surface:light-dark(#fffcf7,#1d211d);--foreground:light-dark(#1f241f,#eceee8);--primary:light-dark(#2f5a3e,#b7d4b0);--secondary:light-dark(#eeebe4,#292e29);--muted:light-dark(#626b62,#a8b0a4);--destructive:light-dark(#a52c26,#ffafa5);--border:light-dark(#ded9cf,#3a4038);--control-border:light-dark(#777b73,#899187);--ring:var(--primary);--text-xs:.75rem;--text-sm:.875rem;--text-base:1rem;--text-lg:1.375rem;--text-title:clamp(1.75rem,4vw,2.375rem);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--radius-sm:4px}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font:var(--text-base)/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:900px;margin:auto;padding:var(--space-8) var(--space-6) 56px}header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;padding-bottom:var(--space-4);border-bottom:1px solid var(--border)}h1{font:italic 400 var(--text-title)/1.1 "Iowan Old Style","Palatino Linotype","Songti SC",serif;letter-spacing:.01em;margin:0}h2{font:400 var(--text-lg)/1.25 "Iowan Old Style","Palatino Linotype","Songti SC",serif;margin:0}p{margin:var(--space-2) 0}.muted,.hint{color:var(--muted);font-size:var(--text-sm)}.subtitle{color:var(--muted);margin:var(--space-1) 0 0;font-size:var(--text-sm)}section{padding-top:var(--space-6)}button,input,select,textarea{font:inherit;color:inherit}button{background:var(--surface);border:1px solid var(--control-border);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);cursor:pointer;min-height:40px}button:hover{background:var(--secondary)}button:disabled{opacity:.5;cursor:not-allowed}:focus-visible{outline:2px solid var(--ring);outline-offset:3px}:focus:not(:focus-visible){outline:none;box-shadow:none}fieldset{border:0;padding:0;margin:0;min-width:0}label{display:block;font-size:var(--text-sm);margin-bottom:var(--space-2)}.check{display:flex;align-items:center;gap:var(--space-2);min-height:32px}.check input{width:20px;height:20px;accent-color:var(--primary);margin:0}input[type=number],select,textarea{width:100%;border:1px solid var(--control-border);border-radius:var(--radius-sm);background-color:var(--surface);padding:var(--space-2);font-size:var(--text-sm)}select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 12px) 50%;background-size:4px 4px,4px 4px;background-repeat:no-repeat;padding-right:36px;height:40px;line-height:1.25}textarea{resize:vertical;min-height:64px}textarea::placeholder{color:var(--muted)}.field{margin:var(--space-4) 0;max-width:480px}#locale{width:auto;min-width:110px}.tools{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}.tools label{margin:0}.tools button,.tools select{height:40px;min-height:40px;font-size:var(--text-sm);line-height:1.25}.status{min-height:24px;margin:var(--space-2) 0;font-size:var(--text-sm)}.error{color:var(--destructive)}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-3)}.model-list{border-top:1px solid var(--border)}.model-row{display:grid;grid-template-columns:minmax(180px,1fr) minmax(0,2fr);gap:var(--space-4);padding:var(--space-3) 0;border-bottom:1px solid var(--border)}.model-identity{min-width:0}.model-name{display:flex;align-items:center;gap:var(--space-2);font-weight:600}.model-id{display:block;color:var(--muted);font-size:var(--text-xs);overflow-wrap:anywhere}.model-controls{display:flex;align-items:flex-start;gap:var(--space-3);min-width:0}.model-controls>.check{flex:0 0 auto;margin:0}.model-controls>.model-description{display:block;min-width:0;flex:1;min-height:64px;margin:0;overflow-wrap:anywhere}.model-name{flex-wrap:wrap;overflow-wrap:anywhere}.model-name>span:first-child{min-width:0}.badge{font-size:var(--text-xs);font-weight:500;color:var(--primary);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 var(--space-1)}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:var(--text-sm);text-align:left}th{font-weight:500;color:var(--muted);background:var(--secondary)}th,td{padding:var(--space-3);border-bottom:1px solid var(--border);vertical-align:top}#logs-table{min-width:880px}#logs-table td{min-width:88px;max-width:220px;overflow-wrap:anywhere}details{border-top:1px solid var(--border);padding:var(--space-3) 0;margin:var(--space-3) 0}summary{cursor:pointer;min-height:24px}.segmented{display:inline-flex;border:1px solid var(--control-border);border-radius:var(--radius-sm);overflow:hidden}.segmented label{display:flex;align-items:center;gap:var(--space-2);margin:0;padding:var(--space-2) var(--space-3);cursor:pointer}.segmented label+label{border-left:1px solid var(--control-border)}.segmented input{accent-color:var(--primary);margin:0}.segmented label:has(input:checked){background:var(--secondary);color:var(--primary)}.style-hint{margin-top:var(--space-2)}#logs{border-top:1px solid var(--border);margin-top:var(--space-6)}#log-count{float:right}#logs summary{display:list-item;font:400 var(--text-lg)/1.25 "Iowan Old Style","Palatino Linotype","Songti SC",serif}[hidden]{display:none!important}@media(max-width:600px){main{padding:var(--space-6) var(--space-4)}.model-row{grid-template-columns:1fr;gap:var(--space-2)}.model-controls{align-items:flex-start}.segmented{display:flex;width:100%}.segmented label{flex:1;justify-content:center;padding:var(--space-2)}.tools{width:100%}.tools #refresh{margin-left:auto}}@media(max-width:375px){.model-controls{flex-direction:column}.model-description{width:100%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
<header>
  <div><h1>Pi Jev Route</h1><p class="subtitle" id="page-subtitle">Choose suitable models for subagents and keep a local decision log.</p></div>
  <div class="tools">
    <label for="locale" id="locale-label">Language</label>
    <select id="locale"><option value="en">English</option><option value="zh">中文</option></select>
    <button id="refresh" type="button">Refresh</button>
  </div>
</header>
<p id="status" class="status" role="status" aria-live="polite"></p>
<section id="rules">
<div class="section-head"><h2 id="rules-title">Models</h2><span id="enabled-count" class="muted" aria-live="polite"></span></div>
<p class="muted" id="current-line"></p>
<form id="settings-form"><fieldset id="fields" disabled>
<label class="check" for="enabled"><input id="enabled" type="checkbox"><span id="enabled-label">Route before dispatch</span></label>
<p id="models-empty" class="muted" hidden></p>
<div class="model-list" id="models" aria-label="Model list"></div>
<div class="field"><label for="fallback" id="fallback-label">Fallback</label><select id="fallback"></select></div>
<fieldset class="style-choice"><legend class="muted" id="style-title">Style task policy</legend><div class="segmented" role="radiogroup" aria-labelledby="style-title"><label for="style-auto"><input id="style-auto" type="radio" name="style-policy" value="auto"><span id="style-auto-label">Automatic selection</span></label><label for="style-main"><input id="style-main" type="radio" name="style-policy" value="main"><span id="style-label">Current model · low</span></label></div><p class="muted style-hint" id="style-hint">This policy affects subagent dispatch only; it does not change the parent session.</p></fieldset>
<details><summary id="advanced-label">Advanced</summary>
<div class="field"><label for="confidence" id="confidence-label">Min confidence</label><input id="confidence" type="number" min="0" max="1" step="0.05" required></div>
<div class="field"><label for="timeout" id="timeout-label">Timeout (ms)</label><input id="timeout" type="number" min="1000" max="30000" step="1" required></div>
<div class="field"><label for="instructions" id="instructions-label">Extra instructions</label><textarea id="instructions" rows="3" maxlength="2000"></textarea></div>
</details>
</fieldset></form>
</section>
<details id="logs">
<summary id="logs-summary"><span id="logs-title">Logs</span><span id="log-count" class="muted"></span></summary>
<p id="empty" class="muted"></p>
<div class="scroll" tabindex="0" role="region" aria-labelledby="logs-title"><table id="logs-table" hidden><thead><tr>
<th scope="col" id="col-time">Time</th><th scope="col" id="col-agent">Agent</th><th scope="col" id="col-choice">Choice</th>
<th scope="col" id="col-report">Reported</th><th scope="col" id="col-state">Status</th><th scope="col" id="col-reason">Reason</th>
</tr></thead><tbody id="log-rows"></tbody></table></div>
</details>
</main>
<script>
(() => {
  'use strict';
  const token = location.hash.slice(1);
  history.replaceState(null, '', location.pathname + location.search);
  const $ = id => document.getElementById(id);
  const ui = {
    zh: {
      localeLabel:'语言', refresh:'刷新', subtitle:'为子代理派发选择合适模型，并保留本地决策记录。', rules:'模型', enabled:'启用派发前选型',
      allow:'启用', current:'当前主模型',
      fallback:'回退模型', fallbackAuto:'自动：low 或当前允许模型', fallbackGone:'（当前不可用）',
      styleTitle:'样式任务策略', styleAuto:'自动选型', styleMain:'当前模型 · low', styleHint:'此策略仅影响子代理派发，不改变主会话。', enabledCount:n=>`已启用 ${n} 个模型`, modelList:'模型列表', details:'编辑说明',
      advanced:'高级', minConfidence:'最低置信度',
      timeout:'超时（毫秒）', instructions:'补充指令', logs:'日志', empty:'暂无日志。',
      emptyModels:'enabledModels 为空。', currentLine:'主模型 ',
      outcomes:{selected:'已选型',fallback:'已回退',explicit:'显式指定',blocked:'已阻止',skipped:'已跳过',error:'错误'},
      cols:{time:'时间',agent:'Agent',choice:'选型',report:'报告',state:'状态',reason:'原因'},
      unreported:'未报告', score:'置信度',
      reading:'正在读取…', synced:'已同步。', syncing:'正在同步…',
      fileError:'设置文件读取失败，请修复后刷新。',
      auth:'缺少认证信息，请重新执行 /pi-jev-route-setting。',
      connect:'连接失败，请重新执行 /pi-jev-route-setting。',
      expire:'认证失效，请重新执行 /pi-jev-route-setting。',
      request:'请求失败，未保存。', incomplete:'服务返回不完整，未保存。',
      conflict:'设置已在别处修改，已重新读取。', invalid:'输入无效，未同步。'
    },
    en: {
      localeLabel:'Language', refresh:'Refresh', subtitle:'Choose suitable models for subagents and keep a local decision log.', rules:'Models', enabled:'Route before dispatch',
      allow:'Enabled', current:'Main model',
      fallback:'Fallback', fallbackAuto:'Auto: low or an allowed model', fallbackGone:'(unavailable)',
      styleTitle:'Style task policy', styleAuto:'Automatic selection', styleMain:'Current model · low', styleHint:'This policy affects subagent dispatch only; it does not change the parent session.', enabledCount:n=>`${n} models enabled`, modelList:'Model list', details:'Edit description',
      advanced:'Advanced', minConfidence:'Min confidence',
      timeout:'Timeout (ms)', instructions:'Extra instructions', logs:'Logs', empty:'No logs yet.',
      emptyModels:'enabledModels is empty.', currentLine:'Parent ',
      outcomes:{selected:'Selected',fallback:'Fallback',explicit:'Explicit',blocked:'Blocked',skipped:'Skipped',error:'Error'},
      cols:{time:'Time',agent:'Agent',choice:'Choice',report:'Reported',state:'Status',reason:'Reason'},
      unreported:'Not reported', score:'confidence',
      reading:'Loading…', synced:'Synced.', syncing:'Syncing…',
      fileError:'Settings file unreadable. Fix it, then refresh.',
      auth:'Missing auth. Run /pi-jev-route-setting again.',
      connect:'Connection failed. Run /pi-jev-route-setting again.',
      expire:'Auth expired. Run /pi-jev-route-setting again.',
      request:'Request failed. Not saved.', incomplete:'Incomplete response. Not saved.',
      conflict:'Settings changed elsewhere. Reloaded.', invalid:'Invalid input. Not synced.'
    }
  };
  let snapshot = null, etag = '', busy = false, locale = 'en', saveTimer = 0;
  const modelInputs = new Map(), logRows = new Map();
  const L = () => ui[locale] || ui.en;
  const text = value => typeof value === 'string' ? value : value == null ? '—' : JSON.stringify(value);
  function node(tag, value) { const el = document.createElement(tag); if (value !== undefined) el.textContent = text(value); return el; }
  function status(message, error = false) { $('status').textContent = message; $('status').classList.toggle('error', error); }
  function applyChrome() {
    const t = L();
    document.documentElement.lang = locale === 'en' ? 'en' : 'zh-CN';
    $('locale-label').textContent = t.localeLabel;
    $('page-subtitle').textContent = t.subtitle;
    $('refresh').textContent = t.refresh;
    $('rules-title').textContent = t.rules;
    $('enabled-label').textContent = t.enabled;
    $('fallback-label').textContent = t.fallback;
    $('style-title').textContent = t.styleTitle;
    $('style-auto-label').textContent = t.styleAuto;
    $('style-label').textContent = t.styleMain;
    $('style-hint').textContent = t.styleHint;
    $('models').setAttribute('aria-label', t.modelList);
    $('models-empty').textContent = t.emptyModels;
    $('advanced-label').textContent = t.advanced;
    $('confidence-label').textContent = t.minConfidence;
    $('timeout-label').textContent = t.timeout;
    $('instructions-label').textContent = t.instructions;
    $('logs-title').textContent = t.logs;
    $('empty').textContent = t.empty;
    $('col-time').textContent = t.cols.time;
    $('col-agent').textContent = t.cols.agent;
    $('col-choice').textContent = t.cols.choice;
    $('col-report').textContent = t.cols.report;
    $('col-state').textContent = t.cols.state;
    $('col-reason').textContent = t.cols.reason;
    if (snapshot) {
      $('current-line').textContent = t.currentLine + (text(snapshot.currentModel));
      for (const fields of modelInputs.values()) {
        fields.allowText.textContent = t.allow;
        fields.enabled.setAttribute('aria-label', t.allow + ': ' + fields.model.id);
        fields.currentLabel.textContent = t.current;
        fields.description.setAttribute('aria-label', t.details + ': ' + (fields.model.name || fields.model.id));
      }
      updateModelCount();
      fallbackOptions();
      renderLogs(snapshot.logs);
    }
  }
  function lock(value) {
    busy = value;
    $('refresh').disabled = value || !token;
    $('fields').disabled = value || !snapshot || !!snapshot.settingsError;
    $('locale').disabled = value || !snapshot || !!snapshot.settingsError;
  }
  async function request(path, method = 'GET', body, version) {
    const headers = {Authorization: 'Bearer ' + token};
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    if (version !== undefined) headers['If-Match'] = version;
    let response;
    try { response = await fetch(path, {method, headers, cache:'no-store', body: body === undefined ? undefined : JSON.stringify(body)}); }
    catch { throw new Error(L().connect); }
    if (!response.ok) {
      const error = new Error(response.status === 401 || response.status === 403 ? L().expire : L().request);
      error.status = response.status; throw error;
    }
    const data = await response.json();
    if (!data || !data.settings || !Array.isArray(data.models) || !Array.isArray(data.logs)) throw new Error(L().incomplete);
    return {data, version:response.headers.get('ETag') || ''};
  }
  function fallbackOptions(selected = $('fallback').value) {
    const t = L();
    $('fallback').replaceChildren(new Option(t.fallbackAuto, ''));
    for (const [id, fields] of modelInputs) if (fields.enabled.checked) $('fallback').append(new Option(id, id));
    if (selected && ![...$('fallback').options].some(option => option.value === selected)) {
      const option = new Option(selected + ' ' + t.fallbackGone, selected); option.disabled = true; $('fallback').append(option);
    }
    $('fallback').value = selected;
    $('fallback').setCustomValidity(selected && !modelInputs.get(selected)?.enabled.checked ? t.invalid : '');
  }
  function populate(data) {
    const s = data.settings;
    locale = s.locale === 'en' ? 'en' : 'zh';
    $('locale').value = locale;
    $('enabled').checked = s.enabled; $('style-main').checked = s.styleUseMain; $('style-auto').checked = !s.styleUseMain;
    $('confidence').value = s.confidenceThreshold; $('timeout').value = s.timeoutMs; $('instructions').value = s.instructions;
    $('models').replaceChildren(); modelInputs.clear();
    data.models.forEach((model, index) => {
      const row = node('div'); row.className = 'model-row';
      const modelCell = node('div'); modelCell.className = 'model-identity';
      const controls = node('div'); controls.className = 'model-controls';
      const enabled = node('input'); enabled.type = 'checkbox'; enabled.id = 'model-enabled-' + index;
      enabled.checked = s.models?.[model.id]?.enabled ?? model.enabled;
      const checkLabel = node('label'); checkLabel.className = 'check'; checkLabel.htmlFor = enabled.id;
      const allowText = node('span', L().allow); checkLabel.append(enabled, allowText);
      const name = node('div'); name.className = 'model-name'; name.append(node('span', model.name || model.id));
      const currentLabel = node('span', L().current); currentLabel.className = 'badge';
      if (model.current) name.append(currentLabel);
      modelCell.append(name, node('span', model.id)); modelCell.lastChild.className = 'model-id';
      const description = node('textarea'); description.className = 'model-description'; description.id = 'model-description-' + index; description.maxLength = 1000; description.rows = 2;
      description.setAttribute('aria-label', L().details + ': ' + (model.name || model.id));
      description.value = s.models?.[model.id]?.description || model.description || '';
      controls.append(checkLabel, description); row.append(modelCell, controls); $('models').append(row);
      modelInputs.set(model.id, {enabled, description, allowText, currentLabel, model, row});
      enabled.addEventListener('change', () => { fallbackOptions(); updateModelCount(); });
    });
    updateModelCount();
    $('models-empty').hidden = data.models.length !== 0;
    $('models-empty').textContent = L().emptyModels;
    fallbackOptions(s.fallbackModel || '');
  }
  function updateModelCount() {
    $('enabled-count').textContent = L().enabledCount([...modelInputs.values()].filter(fields => fields.enabled.checked).length);
  }
  function payload() {
    const models = {...snapshot.settings.models};
    for (const [id, fields] of modelInputs) Object.defineProperty(models, id, {value:{enabled:fields.enabled.checked,description:fields.description.value},enumerable:true,configurable:true,writable:true});
    return {...snapshot.settings, enabled:$('enabled').checked, fallbackModel:$('fallback').value, styleUseMain:$('style-main').checked, confidenceThreshold:Number($('confidence').value), timeoutMs:Number($('timeout').value), locale:$('locale').value === 'en' ? 'en' : 'zh', instructions:$('instructions').value, models};
  }
  function renderLogs(logs) {
    const t = L();
    $('empty').hidden = logs.length > 0; $('empty').textContent = t.empty; $('logs-table').hidden = !logs.length;
    $('log-count').textContent = logs.length;
    for (const log of logs) {
      let row = logRows.get(log.id);
      if (!row) {
        const tr = node('tr'), cells = Array.from({length:6}, () => node('td'));
        tr.append(...cells); $('log-rows').append(tr); row = {cells}; logRows.set(log.id, row);
      }
      const date = new Date(log.at);
      const report = log.actualModel ? text(log.actualModel) + (log.actualThinking ? ' · ' + text(log.actualThinking) : '') : t.unreported;
      const values = [Number.isNaN(date.getTime()) ? text(log.at) : date.toLocaleString(locale === 'en' ? 'en' : 'zh-CN'), log.agent || '—', log.requestedModel || '—', report, (t.outcomes[log.outcome] || text(log.outcome)) + (log.actualStatus ? ' / ' + text(log.actualStatus) : ''), text(log.reason) + (Number.isFinite(log.confidence) ? ' · ' + t.score + ' ' + log.confidence : '')];
      row.cells.forEach((cell, index) => { cell.textContent = text(values[index]); });
    }
  }
  async function persist() {
    if (!snapshot || snapshot.settingsError || busy || !etag || !$('settings-form').checkValidity()) return;
    const body = payload();
    lock(true); status(L().syncing);
    try {
      const {data, version} = await request('/settings', 'PUT', body, etag);
      snapshot = data; etag = version; locale = data.settings.locale === 'en' ? 'en' : 'zh';
      applyChrome();
      status(data.settingsError ? L().fileError : L().synced, !!data.settingsError);
    } catch (error) {
      if (error.status === 409) {
        try {
          const latest = await request('/settings');
          snapshot = latest.data; etag = latest.version; locale = snapshot.settings.locale === 'en' ? 'en' : 'zh';
          populate(snapshot); applyChrome(); status(L().conflict, true);
        } catch (reload) { status(reload.message, true); }
      } else status(error.message, true);
    } finally { lock(false); }
  }
  function scheduleSave(delay) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { persist(); }, delay);
  }
  async function refresh() {
    if (busy || !token) return;
    lock(true); status(L().reading);
    try {
      const {data, version} = await request('/settings'); snapshot = data; etag = version;
      populate(data); applyChrome();
      logRows.clear(); $('log-rows').replaceChildren(); renderLogs(data.logs);
      status(data.settingsError ? L().fileError : L().synced, !!data.settingsError);
    } catch (error) { status(error.message, true); }
    finally { lock(false); }
  }
  $('settings-form').addEventListener('input', event => {
    if (event.target.closest('textarea') || event.target.type === 'number') scheduleSave(400);
    else scheduleSave(0);
  });
  $('fallback').addEventListener('change', () => fallbackOptions());
  $('locale').addEventListener('change', () => { locale = $('locale').value === 'en' ? 'en' : 'zh'; applyChrome(); scheduleSave(0); });
  $('settings-form').addEventListener('submit', event => event.preventDefault());
  $('refresh').addEventListener('click', refresh);
  if (!token) { status(L().auth, true); lock(false); } else refresh();
})();
</script>
</body>
</html>
